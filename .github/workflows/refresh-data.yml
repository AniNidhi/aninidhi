name: Refresh Hindi dub candidates

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Poll for new Hindi dub uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_candidates.py

      - name: List anime still marked Airing
        run: python scripts/flag_airing_review.py

      - name: Commit new candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_review.json
          git diff --staged --quiet || git commit -m "chore: refresh Hindi dub candidates"
          git push